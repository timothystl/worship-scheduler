name: Validate changes

on:
  push:
    branches:
      - 'claude/**'
      - 'codex/**'
      - 'safety/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate recovery tooling
        run: |
          bash -n scripts/verify-d1-recovery.sh
          python3 -m py_compile scripts/prepare-d1-import.py

      - name: Run tests
        run: npm test

      - name: Verify built HTML scripts parse
        run: node .github/scripts/check-built-scripts.js
